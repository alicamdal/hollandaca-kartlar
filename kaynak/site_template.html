<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ömer'in Kelime Kartları</title>
<meta name="theme-color" content="#0f6fae">
<link rel="icon" href="img/1F4D5.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#e9f3f8; --card:#ffffff; --ink:#15314b; --muted:#5a6f84; --line:#d2e1ea;
  --accent:#f26b1d; --accent-ink:#ffffff; --blue:#0f6fae; --blue-soft:#d8ecf8;
  --glow:#ffe3cf; --shadow:0 2px 0 #c9dbe6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1b26; --card:#172837; --ink:#eaf2f8; --muted:#9db2c4; --line:#27404f;
    --accent:#ff8a45; --accent-ink:#1c0e04; --blue:#5cb4ee; --blue-soft:#1d3a50;
    --glow:#3a2a1f; --shadow:0 2px 0 #0a131b; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
/* no double-tap zoom / 300ms delay on buttons (iOS + Android) */
button,a,select,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:grid;gap:14px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.nav{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:1.5rem;line-height:1;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.nav[aria-disabled="true"]{opacity:.35;pointer-events:none}
.ttl{text-align:center;display:grid;gap:0}
.ttl h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1.35rem;margin:0;line-height:1.2;text-wrap:balance}
.ttl small{color:var(--muted);font-variant-numeric:tabular-nums}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px}
.ctl{border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.ctl[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.ctl.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl.play[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* speed slider */
.speed{display:grid;grid-template-columns:48px 1fr 48px auto;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 12px 4px 6px;box-shadow:var(--shadow)}
.spd{width:48px;height:48px;border:0;border-radius:12px;background:transparent;font-size:1.7rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.spd:active{background:var(--blue-soft)}
.speed output{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2em;text-align:right}
.rate{--p:50%;-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;padding:0;background:transparent;cursor:pointer;touch-action:pan-y}
.rate:focus{outline:none}
.rate:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.rate::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(to right,var(--accent) 0,var(--accent) var(--p),var(--line) var(--p),var(--line) 100%)}
.rate::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.rate::-moz-range-track{height:10px;border-radius:999px;background:var(--line);border:0}
.rate::-moz-range-progress{height:10px;border-radius:999px;background:var(--accent)}
.rate::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* cards */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.cards{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;text-align:left;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s,background .12s}
.card:active{transform:scale(.98)}
.card.on{border-color:var(--accent);background:var(--glow)}
.pic{width:84px;height:84px;display:grid;place-items:center}
.pic img{width:84px;height:84px}
.dot{width:66px;height:66px;border-radius:50%;border:3px solid var(--ink)}
.num{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:3rem;color:var(--blue);line-height:1}
.none{font-size:2.4rem}
.txt{display:grid;gap:2px;min-width:0}
.nl{font-family:"Fredoka",system-ui,sans-serif;font-weight:500;font-size:1.7rem;line-height:1.15;overflow-wrap:anywhere}
.nl .art{color:var(--blue);font-weight:400}
.tr{color:var(--muted);font-size:1rem}
.card.stack{grid-template-columns:64px 1fr}
.card.stack .pic,.card.stack .pic img{width:64px;height:64px}
.card.stack .nl{font-size:1.45rem}

/* home */
.hero{display:grid;gap:6px;padding-block:10px 4px}
.hero h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:2rem;margin:0;line-height:1.1}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.topics{display:grid;gap:10px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;box-shadow:var(--shadow)}
.topic img{width:52px;height:52px}
.topic h2{margin:0;font-family:"Fredoka",system-ui,sans-serif;font-weight:500;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-grid;place-items:center;min-width:40px;height:36px;padding-inline:10px;border-radius:10px;background:var(--blue-soft);color:var(--ink);text-decoration:none;font-weight:700;font-variant-numeric:tabular-nums}

/* settings */
details.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
details.set summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.set .body{display:grid;gap:10px;padding-top:8px}
.set label{font-weight:700;font-size:.9rem}
.set select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.set p{margin:0;font-size:.9rem;color:var(--muted)}
.warn{background:var(--glow);border-radius:12px;padding:10px 12px;font-size:.95rem}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding-top:8px}
footer a{color:inherit}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:active{transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const PAGES = /*DATA*/[];
const COLORS = {rood:"#e53935",blauw:"#1e63d6",geel:"#fdd835",groen:"#43a047",oranje:"#fb8c00",paars:"#8e24aa",
  roze:"#f48fb1",bruin:"#795548",zwart:"#111111",wit:"#ffffff",grijs:"#9e9e9e"};
const TOPIC_ICON = {"Vücudum":"1F642","Renkler":"1F58D","Günler":"1F305","Sayılar":"1F4D5","Hayvanlar":"1F431",
  "Ailem":"1F469","Yiyecekler":"1F34E","Okulda":"1F3EB","Konuşalım":"1F44B"};

/* ---------- settings (kept only on this phone) ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("hk_"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("hk_"+k, JSON.stringify(v)); }catch(e){} }
};
const RATE_MIN = 0.5, RATE_MAX = 1.2, RATE_STEP = 0.05, RATE_DEFAULT = 0.9;
const clampRate = r => Math.min(RATE_MAX, Math.max(RATE_MIN, +(Math.round(r / RATE_STEP) * RATE_STEP).toFixed(2)));
let rate = store.get("rate", null);
if(typeof rate !== "number" || !isFinite(rate)) rate = store.get("slow", false) ? 0.6 : RATE_DEFAULT;  // old 🐢 setting
rate = clampRate(rate);
let turkishFirst = store.get("tr", false);
let repeat = store.get("rep", 1);

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* ---------- speech ---------- */
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let voices = [];
function refreshVoices(){ if(synth){ try{ voices = synth.getVoices() || []; }catch(e){ voices = []; } } }
function onVoices(){ refreshVoices(); if(route().page) renderSettingsVoices(); }
if(synth){
  refreshVoices();
  if(typeof synth.addEventListener === "function") synth.addEventListener("voiceschanged", onVoices);
  else synth.onvoiceschanged = onVoices;
  // iOS Safari often never fires voiceschanged: poll for a few seconds
  let tries = 0;
  const poll = setInterval(()=>{ refreshVoices(); if(voices.length || ++tries > 20){ clearInterval(poll); onVoices(); } }, 250);
}
function norm(l){ return (l||"").toLowerCase().replace("_","-"); }
function nlVoices(){ return voices.filter(v=>norm(v.lang).startsWith("nl")).sort((a,b)=>(norm(a.lang)==="nl-nl"?0:1)-(norm(b.lang)==="nl-nl"?0:1)); }
function pickVoice(lang){
  if(lang==="nl"){
    const saved = store.get("voice", null);
    const list = nlVoices();
    return list.find(v=>v.name===saved) || list.find(v=>norm(v.lang)==="nl-nl") || list[0] || null;
  }
  return voices.find(v=>norm(v.lang)==="tr-tr") || voices.find(v=>norm(v.lang).startsWith("tr")) || null;
}
let liveUtt = null;   // keep a reference: Chrome can garbage-collect the utterance and then never fires onend
function sayOnce(text, lang){
  return new Promise(res=>{
    if(!synth || typeof SpeechSynthesisUtterance === "undefined"){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(lang);
    if(v){ u.voice=v; u.lang=v.lang; } else { u.lang = lang==="nl" ? "nl-NL" : "tr-TR"; }
    u.rate = lang==="nl" ? rate : 1.0;       // slider value is read for every word, so a change applies from the next word
    let done=false; const fin=()=>{ if(!done){done=true; clearTimeout(t); if(liveUtt===u) liveUtt=null; res();} };
    const t = setTimeout(fin, 1500 + text.length*180/u.rate);   // some Android builds never fire onend
    u.onend = fin; u.onerror = fin;
    liveUtt = u;
    synth.speak(u);   // called synchronously inside the tap handler, which iOS needs for the first word
    if(synth.paused) synth.resume();
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
let runId = 0;
async function sayItem(item, card, id){
  card && card.classList.add("on");
  if(turkishFirst && pickVoice("tr")){ await sayOnce(item.tr.replace(/\(.*?\)/g,""), "tr"); if(id!==runId) return; await wait(250); }
  for(let i=0;i<repeat;i++){
    await sayOnce(item.nl, "nl");
    if(id!==runId) break;
    if(i<repeat-1) await wait(450);
  }
  card && card.classList.remove("on");
}
function stopAll(){
  runId++;
  // cancel() right before speak() can swallow the new word in Safari, so only cancel when something is actually queued
  if(synth && (synth.speaking || synth.pending)) synth.cancel();
  Array.prototype.forEach.call(document.querySelectorAll(".card.on"), c=>c.classList.remove("on"));
  setPlaying(false);
}
// leaving the app mid-sentence can leave speech stuck (iOS/Android): stop cleanly
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopAll(); });
window.addEventListener("pagehide", ()=>stopAll());

/* ---------- routing ---------- */
function route(){ const p = new URLSearchParams(location.search).get("s"); const n = parseInt(p,10); return {page: PAGES.find(x=>x.page===n) || null}; }
function go(n){ stopAll(); history.pushState({}, "", n ? "?s="+n : "./"); render(); window.scrollTo(0,0); }
window.addEventListener("popstate", ()=>{ stopAll(); render(); });

/* ---------- rendering ---------- */
const app = document.getElementById("app");
function setKids(node, ...kids){   // replaceChildren is missing before iOS 14
  kids = kids.flat().filter(k=>k!==null && k!==undefined);
  if(typeof node.replaceChildren === "function"){ node.replaceChildren(...kids); return; }
  while(node.firstChild) node.removeChild(node.firstChild);
  kids.forEach(k=>node.appendChild(k.nodeType ? k : document.createTextNode(k)));
}
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==null && v!==undefined) e.setAttribute(k,v); }
  for(const k of kids.flat()){ if(k===null||k===undefined) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function picEl(item){
  const p=item.pic;
  if(typeof p==="string") return el("div",{class:"pic"}, el("img",{src:`img/${p}.svg`,alt:""}));
  if(Array.isArray(p) && p[0]==="color"){ const d=el("div",{class:"dot"}); d.style.background=COLORS[item.nl]||"#ccc"; return el("div",{class:"pic"},d); }
  if(Array.isArray(p) && p[0]==="num") return el("div",{class:"pic"}, el("span",{class:"num"},p[1]));
  return el("div",{class:"pic"}, el("span",{class:"none","aria-hidden":"true"},"💬"));
}
function nlEl(nl){
  const m = nl.match(/^(de|het) (.+)$/);
  return m ? el("span",{class:"nl"}, el("span",{class:"art"},m[1]+" "), m[2]) : el("span",{class:"nl"}, nl);
}
let playBtn=null;
function setPlaying(on){ if(playBtn){ playBtn.setAttribute("aria-pressed", on?"true":"false"); playBtn.textContent = on ? "■  Durdur" : "▶  Hepsini oku"; } }

function renderPage(pg){
  const i = PAGES.indexOf(pg);
  const prev = PAGES[i-1], next = PAGES[i+1];
  const cards = pg.items.map(item=>{
    const c = el("button",{class:"card"+(pg.stack?" stack":""), type:"button", "aria-label":`${item.nl} — ${item.tr}`},
      picEl(item), el("span",{class:"txt"}, nlEl(item.nl), el("span",{class:"tr"}, item.tr)));
    c.addEventListener("click", async ()=>{ stopAll(); const id=++runId; await sayItem(item, c, id); });
    return c;
  });
  playBtn = el("button",{class:"ctl play",type:"button","aria-pressed":"false"},"▶  Hepsini oku");
  playBtn.addEventListener("click", async ()=>{
    if(playBtn.getAttribute("aria-pressed")==="true"){ stopAll(); return; }
    stopAll(); const id=++runId; setPlaying(true);
    for(let k=0;k<pg.items.length;k++){
      cards[k].scrollIntoView({block:"nearest",behavior:"smooth"});
      await sayItem(pg.items[k], cards[k], id);
      if(id!==runId) return;
      await wait(900);
      if(id!==runId) return;
    }
    setPlaying(false);
  });
  const toggle = (label, key, get, set) => {
    const b = el("button",{class:"ctl",type:"button","aria-pressed":String(get())}, label);
    b.addEventListener("click",()=>{ set(!get()); store.set(key, get()); b.setAttribute("aria-pressed", String(get())); });
    return b;
  };
  const trBtn = toggle("🇹🇷  Önce Türkçe","tr",()=>turkishFirst,v=>turkishFirst=v);
  const repBtn = toggle("🔁  2 kez","rep",()=>repeat===2,v=>repeat=v?2:1);
  const speed = speedControl(()=>{
    // preview the new speed with the first word, but never interrupt "Hepsini oku"
    if(playBtn && playBtn.getAttribute("aria-pressed")==="true") return;
    stopAll(); const id=++runId; sayItem(pg.items[0], cards[0], id);
  });

  setKids(app,
    el("div",{class:"bar"},
      el("a",{class:"nav",href:prev?`?s=${prev.page}`:"#", "aria-label":"Önceki sayfa","aria-disabled":prev?"false":"true", onclick:e=>{e.preventDefault(); prev&&go(prev.page);}},"‹"),
      el("div",{class:"ttl"}, el("h1",{}, `${pg.tr} · ${pg.nl}`), el("small",{}, `Sayfa ${pg.page} / ${PAGES.length}`)),
      el("a",{class:"nav",href:next?`?s=${next.page}`:"#", "aria-label":"Sonraki sayfa","aria-disabled":next?"false":"true", onclick:e=>{e.preventDefault(); next&&go(next.page);}},"›")
    ),
    el("div",{class:"controls"}, playBtn, repBtn, trBtn),
    speed,
    noVoiceWarning(),
    el("div",{class:"cards"}, cards),
    settings(),
    el("footer",{}, el("a",{href:"./",onclick:e=>{e.preventDefault(); go(null);}},"Tüm sayfalar"), " · Resimler: ",
      el("a",{href:"https://openmoji.org",target:"_blank",rel:"noopener"},"OpenMoji"), " (CC BY-SA 4.0)")
  );
}
function speedControl(preview){
  const fmt = r => r.toFixed(2).replace(/0$/,"") + "×";
  const pct = r => ((r - RATE_MIN) / (RATE_MAX - RATE_MIN) * 100) + "%";
  const out = el("output",{"aria-hidden":"true"}, fmt(rate));
  const range = el("input",{type:"range",class:"rate",min:RATE_MIN,max:RATE_MAX,step:RATE_STEP,value:rate,"aria-label":"Okuma hızı"});
  const show = ()=>{ out.textContent = fmt(rate); range.style.setProperty("--p", pct(rate)); range.setAttribute("aria-valuetext", fmt(rate)); };
  const setRate = (r, speak)=>{ rate = clampRate(r); range.value = rate; store.set("rate", rate); show(); if(speak) preview(); };
  range.addEventListener("input", ()=>setRate(parseFloat(range.value), false));   // live while dragging
  range.addEventListener("change", ()=>setRate(parseFloat(range.value), true));   // on release: hear it
  // iOS Safari only moves a slider by dragging the thumb, so the animals also step the speed
  const slower = el("button",{class:"spd",type:"button","aria-label":"Daha yavaş"},"🐢");
  const faster = el("button",{class:"spd",type:"button","aria-label":"Daha hızlı"},"🐇");
  slower.addEventListener("click", ()=>setRate(rate - 0.1, true));
  faster.addEventListener("click", ()=>setRate(rate + 0.1, true));
  show();
  return el("div",{class:"speed",role:"group","aria-label":"Okuma hızı"}, slower, range, faster, out);
}
function noVoiceWarning(){
  const w = el("div",{class:"warn",id:"nowarn",hidden:""},
    IS_IOS ? "Bu iPhone'da Hollandaca ses bulunamadı. Ayarlar → Erişilebilirlik → Seslendirilen İçerik → Sesler → Nederlands → bir ses indir."
           : "Bu telefonda Hollandaca ses bulunamadı. Ayarlar → Metin okuma → Google → Dilleri yükle → Nederlands (Nederland).");
  setTimeout(()=>{
    refreshVoices();
    if(!synth){ w.textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome ya da Safari'de aç."; w.hidden=false; }
    else if(voices.length && !nlVoices().length) w.hidden=false;
  }, 2500);   // iOS loads its voice list late
  return w;
}
let voiceSel=null;
function renderSettingsVoices(){
  if(!voiceSel) return;
  const list = nlVoices(); const cur = pickVoice("nl");
  setKids(voiceSel, list.length ? list.map(v=>el("option",{value:v.name, selected: cur&&v.name===cur.name ? "" : null},
    `${v.name} (${norm(v.lang)==="nl-be"?"Belçika":"Hollanda"})`)) : [el("option",{},"Ses listesi yükleniyor…")]);
}
function settings(){
  voiceSel = el("select",{id:"voice"});
  voiceSel.addEventListener("change",()=>{ store.set("voice", voiceSel.value); stopAll(); sayOnce("Hallo Ömer!","nl"); });
  renderSettingsVoices();
  return el("details",{class:"set"}, el("summary",{},"⚙  Ses ayarları"),
    el("div",{class:"body"},
      el("label",{for:"voice"},"Hollandaca ses"), voiceSel,
      el("p",{},"Seçim sadece bu telefonda saklanır. \"nl-BE\" sesleri Belçika aksanıdır; okul için Hollanda seslerini seç."),
      IS_IOS ? el("p",{},"iPhone'da ses gelmiyorsa yandaki sessiz düğmesini kapat ve sesi aç.") : null));
}
function renderHome(){
  const groups = [];
  for(const p of PAGES){ const g = groups.find(x=>x.tr===p.tr); if(g) g.pages.push(p); else groups.push({tr:p.tr,nl:p.nl,pages:[p]}); }
  setKids(app,
    el("div",{class:"hero"}, el("h1",{},"Ömer'in kelime kartları"),
      el("p",{},"Kağıttaki QR kodu okut ya da aşağıdan bir sayfa seç. Kelimeye dokununca telefon Hollandaca okur.")),
    el("div",{class:"topics"}, groups.map(g=>el("div",{class:"topic"},
      el("img",{src:`img/${TOPIC_ICON[g.tr]||"1F4D5"}.svg`,alt:""}),
      el("div",{}, el("h2",{}, `${g.tr} · ${g.nl}`),
        el("div",{class:"chips"}, g.pages.map(p=>el("a",{class:"chip",href:`?s=${p.page}`,onclick:e=>{e.preventDefault(); go(p.page);}}, String(p.page)))))))),
    el("footer",{}, "Resimler: ", el("a",{href:"https://openmoji.org",target:"_blank",rel:"noopener"},"OpenMoji"), " (CC BY-SA 4.0)")
  );
}
function render(){ const r = route(); if(r.page){ document.title = `${r.page.nl} · Ömer`; renderPage(r.page); } else { document.title="Ömer'in Kelime Kartları"; renderHome(); } }
render();
</script>
</body>
</html>
